<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0B0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="grad2" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:rgba(232,160,32,0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Radial gradient accent -->
  <circle cx="600" cy="315" r="600" fill="url(#grad2)"/>

  <!-- Gold accent line -->
  <rect x="200" y="280" width="800" height="1" fill="#E8A020" opacity="0.3"/>

  <!-- Logo/Brand section -->
  <g>
    <!-- Camera icon -->
    <g transform="translate(250, 150)">
      <rect x="0" y="20" width="80" height="60" rx="4" fill="none" stroke="#E8A020" stroke-width="2"/>
      <circle cx="40" cy="50" r="15" fill="none" stroke="#E8A020" stroke-width="2"/>
      <rect x="60" y="25" width="12" height="12" fill="#E8A020" opacity="0.6"/>
    </g>

    <!-- Phosnap title -->
    <text x="350" y="180" font-family="Cinzel, serif" font-size="64" font-weight="400" fill="#F2F2F2" letter-spacing="3">
      PHOSNAP
    </text>

    <!-- Subtitle -->
    <text x="350" y="220" font-family="Cormorant Garamond, serif" font-size="28" font-weight="300" fill="#B8860B" letter-spacing="2" font-style="italic">
      φῶς · light · captured
    </text>
  </g>

  <!-- Main tagline -->
  <text x="600" y="380" font-family="Noto Sans, sans-serif" font-size="32" font-weight="300" fill="#F2F2F2" text-anchor="middle" letter-spacing="1">
    Global Snap Photography Platform
  </text>

  <!-- Subtext -->
  <text x="600" y="430" font-family="Noto Sans, sans-serif" font-size="18" font-weight="300" fill="rgba(242,242,242,0.6)" text-anchor="middle" letter-spacing="0.5">
    Book professional photographers in 30+ cities worldwide
  </text>

  <!-- Decorative dots -->
  <circle cx="300" cy="500" r="3" fill="#E8A020" opacity="0.4"/>
  <circle cx="330" cy="500" r="3" fill="#E8A020" opacity="0.4"/>
  <circle cx="360" cy="500" r="3" fill="#E8A020" opacity="0.4"/>
  <circle cx="870" cy="500" r="3" fill="#E8A020" opacity="0.4"/>
  <circle cx="900" cy="500" r="3" fill="#E8A020" opacity="0.4"/>
  <circle cx="930" cy="500" r="3" fill="#E8A020" opacity="0.4"/>

  <!-- Footer text -->
  <text x="600" y="570" font-family="Noto Sans, sans-serif" font-size="14" font-weight="300" fill="rgba(242,242,242,0.5)" text-anchor="middle" letter-spacing="2">
    www.phosnap.com
  </text>
</svg>
