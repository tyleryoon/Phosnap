<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" fill="#0B0B0B"/>

  <!-- 8 radiating dashed lines -->
  <!-- Up -->
  <line x1="200" y1="130" x2="200" y2="10"  stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Up-Right -->
  <line x1="249" y1="151" x2="333" y2="67"  stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Right -->
  <line x1="270" y1="200" x2="390" y2="200" stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Down-Right -->
  <line x1="249" y1="249" x2="333" y2="333" stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Down -->
  <line x1="200" y1="270" x2="200" y2="390" stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Down-Left -->
  <line x1="151" y1="249" x2="67"  y2="333" stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Left -->
  <line x1="130" y1="200" x2="10"  y2="200" stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Up-Left -->
  <line x1="151" y1="151" x2="67"  y2="67"  stroke="rgba(242,242,242,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- PHOSNAP text -->
  <text
    x="200"
    y="212"
    text-anchor="middle"
    font-family="Cinzel, 'Times New Roman', serif"
    font-size="38"
    font-weight="400"
    letter-spacing="12"
    fill="#F2F2F2"
  >PHOSNAP</text>
</svg>
