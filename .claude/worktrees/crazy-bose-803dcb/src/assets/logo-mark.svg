<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 8 radiating dashed lines from center -->
  <!-- Up -->
  <line x1="24" y1="16" x2="24" y2="2"  stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Up-Right -->
  <line x1="29.3" y1="18.7" x2="39.8" y2="8.2"  stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Right -->
  <line x1="32" y1="24" x2="46" y2="24" stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Down-Right -->
  <line x1="29.3" y1="29.3" x2="39.8" y2="39.8" stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Down -->
  <line x1="24" y1="32" x2="24" y2="46" stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Down-Left -->
  <line x1="18.7" y1="29.3" x2="8.2" y2="39.8"  stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Left -->
  <line x1="16" y1="24" x2="2" y2="24"  stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Up-Left -->
  <line x1="18.7" y1="18.7" x2="8.2" y2="8.2"   stroke="rgba(242,242,242,0.85)" stroke-width="1" stroke-dasharray="2.5 2.5"/>
</svg>
