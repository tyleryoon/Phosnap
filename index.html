<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ── -->
  <title>Phosnap — Light captured. Moments made.</title>
  <!-- 숫자는 쓰지 않는다. '48개 도시 2,400+ 작가' 가 박혀 있었는데 둘 다
       지어낸 값이었다. 검색 결과에 거짓말이 남으면 고치기도 어렵다. -->
  <meta name="description" content="서울·교토·파리·발리에서 활동하는 스냅 사진작가를 찾고, 헤어메이크업·의상·촬영 장소까지 한 번에 예약하세요. Phosnap." />
  <meta name="keywords" content="스냅촬영, 여행 사진작가, 스냅사진, 커플스냅, 웨딩스냅, travel photographer, snap photo, phosnap" />
  <meta name="author" content="Phosnap" />
  <meta name="robots" content="index, follow" />
  <!-- canonical 은 여기 두지 않는다. 여기에 홈 주소를 박아두면 SPA 의
       모든 하위 페이지가 "사실 나는 홈이다" 라고 선언하게 되어 작가 찾기·
       헤메 찾기 같은 목록이 통째로 색인에서 빠진다.
       페이지별 canonical 은 src/components/SEO.jsx 가 낸다. -->

  <!-- ── Open Graph (Facebook / KakaoTalk) ── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://phosnap.com/" />
  <meta property="og:site_name" content="Phosnap" />
  <meta property="og:title" content="Phosnap — Light captured. Moments made." />
  <meta property="og:description" content="Find your photographer, anywhere in the world. Book snap photographers in Seoul, Kyoto, Paris, Bali." />
  <meta property="og:image" content="https://phosnap.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:locale:alternate" content="ja_JP" />
  <meta property="og:locale:alternate" content="zh_CN" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@phosnap_kr" />
  <meta name="twitter:title" content="Phosnap — Light captured. Moments made." />
  <meta name="twitter:description" content="Find your photographer, anywhere in the world." />
  <meta name="twitter:image" content="https://phosnap.com/og-image.jpg" />

  <!-- ── hreflang (multilingual SEO) ── -->
  <link rel="alternate" hreflang="ko" href="https://phosnap.com/" />
  <link rel="alternate" hreflang="en" href="https://phosnap.com/" />
  <link rel="alternate" hreflang="ja" href="https://phosnap.com/" />
  <link rel="alternate" hreflang="zh" href="https://phosnap.com/" />
  <link rel="alternate" hreflang="x-default" href="https://phosnap.com/" />

  <!-- ── Favicon ── -->
  <link rel="icon" type="image/svg+xml" href="/logo-full.svg" />
  <link rel="apple-touch-icon" href="/logo-full.svg" />

  <!-- ── PWA Manifest & Meta Tags ── -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FBFAF7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />

  <!-- ── Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 본문: Pretendard. 한국어 화면에서 Noto Sans KR 보다 자간·획이 정돈돼 있고
       200~900 가변이라 Medium·SemiBold 단계를 쓸 수 있다. -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- 디스플레이: Instrument Serif. 큰 크기에서만 쓴다.
       일본어·중국어 본문은 Noto Sans 가 계속 받는다. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- ── JSON-LD Structured Data ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Phosnap",
    "alternateName": "포스냅",
    "url": "https://phosnap.com/",
    "description": "Global snap photography booking platform connecting photographers and clients worldwide.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://phosnap.com/photographers?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    },
    "inLanguage": ["ko", "en", "ja", "zh"],
    "publisher": {
      "@type": "Organization",
      "name": "Phosnap",
      "logo": {
        "@type": "ImageObject",
        "url": "https://phosnap.com/logo-full.svg"
      }
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- ── Service Worker Registration ── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
